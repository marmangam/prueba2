name: Publicar nueva versión en desarrollo

on:
  push:
    branches: [ desarrollo ]  # Se activa solo en la rama desarrollo

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Clonando el repositorio y estableciendo el espacio de trabajo
        uses: actions/checkout@v3

      - name: Configurando Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '16'

      - name: Ejecutando los test
        run: |
          chmod +x gradlew
          ./gradlew test

  Publish:
    runs-on: ubuntu-latest
    needs: Test  # Solo se ejecuta si el job "Test" fue exitoso
    env:
      GITHUB_LOGIN: ${{ github.actor }}
      GITHUB_PACKAGES: ${{ secrets.GIT_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GIT_TOKEN }}
    steps:
      - name: Clonando el repositorio y estableciendo el espacio de trabajo
        uses: actions/checkout@v3

      - name: Configurando Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '16'

      - name: Publicando el artefacto
        run: |
          chmod +x gradlew
          ./gradlew publish

