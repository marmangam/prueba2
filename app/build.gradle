plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'maven-publish'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.example.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}



publishing { 
    repositories { 
        maven { 
            name = "GitHubPackages" 
            url = uri("https://maven.pkg.github.com/marmangam/prueba2") 
            credentials{ 
                username = project.findProperty("gpr.user") ?: 
                System.getenv("GITHUB_LOGIN") 
                password = project.findProperty("gpr.key") ?: 
                System.getenv("GITHUB_PACKAGES") 
            } 
        } 
    } 
    publications { 
        gpr(MavenPublication) { 
            //Del tutorial https://docs.gradle.org/current/userguide/publishing_maven.html#publishing_maven 
            groupId = 'us.dit.fs.marmangam' 
            artifactId = 'gestor-documental' 
            version = '1.0-SNAPSHOT' 
            from components.java 
        } 
    } 
} 
